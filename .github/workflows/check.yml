name: Validate SwordDock Bible

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: build-and-test
          - os: windows-2025
            name: Windows desktop
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Prepare legacy 0.1.11 KJV compatibility fixtures for tests only
        shell: bash
        run: |
          git fetch --depth=1 origin refs/tags/0.1.11
          test "$(git rev-parse FETCH_HEAD^{commit})" = 3eca71aac0497332151b147c684c29dc949d4dc7
          git archive FETCH_HEAD library/kjv | tar -xf -
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npm run package:community
      - run: npm run package:preview
      - name: Verify independent offline fresh installation
        run: npm run smoke:preview
      - name: Open and restart native Obsidian in an offline Linux session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/obsidian_1.15.1_amd64.deb"
          curl --fail --location --retry 3 --output "$installer" 'https://github.com/obsidianmd/obsidian-releases/releases/download/v1.15.1/obsidian_1.15.1_amd64.deb'
          echo "f77b6dfc8c040214f2febad2b1b9b051b6a838a47b0f4fb90a31cfcb79b8fcec  $installer" | sha256sum --check
          sudo apt-get update -qq
          sudo apt-get install -y "$installer" xvfb xauth dbus-x11 iproute2
          namespace=sworddock-qa
          sudo ip netns add "$namespace"
          trap 'sudo ip netns delete "$namespace"' EXIT
          sudo ip -n "$namespace" link set lo up
          sudo ip -n "$namespace" link show
          previews=(dist/*-offline.zip)
          test "${#previews[@]}" = 1
          sudo ip netns exec "$namespace" sudo -u "$(id -un)" -H -- xvfb-run -a -s '-screen 0 1440x960x24' \
            dbus-run-session -- "$(command -v node)" scripts/verify-native-desktop.mjs "$(command -v obsidian)" dist/community
      - name: Open the packaged plugin and restart native Obsidian
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'Obsidian-1.15.1.exe'
          $outer = Join-Path $env:RUNNER_TEMP 'sworddock-installer'
          $app = Join-Path $env:RUNNER_TEMP 'sworddock-app'
          Invoke-WebRequest 'https://github.com/obsidianmd/obsidian-releases/releases/download/v1.15.1/Obsidian-1.15.1.exe' -OutFile $installer
          if ((Get-FileHash $installer).Hash -ne '218c7d30acc065355ce94719dd996d5e2a2347cde3811ea5dc29380583f02b58') {
            throw 'Obsidian installer digest mismatch.'
          }
          7z x $installer "-o$outer" -y | Out-Null
          if ($LASTEXITCODE) { throw 'Could not unpack the installer.' }
          $payload = Get-ChildItem $outer -Recurse -Filter 'app-64.7z' | Select-Object -First 1
          if (!$payload) { throw 'Missing x64 application payload.' }
          7z x $payload.FullName "-o$app" -y | Out-Null
          if ($LASTEXITCODE) { throw 'Could not unpack the application.' }
          $previews = @(Get-ChildItem dist -Filter '*-offline.zip')
          if ($previews.Count -ne 1) { throw 'Expected one freshly built preview.' }
          node scripts/verify-native-desktop.mjs (Join-Path $app 'Obsidian.exe') dist/community
