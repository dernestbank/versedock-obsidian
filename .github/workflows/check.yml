name: Validate SwordDock Bible

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npm run package:preview
      - name: Verify independent offline fresh installation
        run: npm run smoke:preview
