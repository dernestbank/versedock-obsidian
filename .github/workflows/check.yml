name: Validate VerseDock

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npm run package:preview
      - name: Verify package contents
        run: unzip -l dist/VerseDock-0.1.0-offline-preview.zip | grep -E 'main.js|library/webp/manifest.json'
